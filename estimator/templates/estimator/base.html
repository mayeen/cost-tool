{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assignment Cost Estimate</title>
  <link rel="stylesheet" href="{% static 'estimator/style.css' %}">
</head>
<body>
  <div class="container">
    <h1>Assignment Cost Estimate</h1>
    <p class="subtitle">What it costs, and what it takes, to send an employee abroad.</p>

    <nav class="tabs">
      <a href="{% url 'cost' %}" class="tab{% if active_tab == 'cost' %} active{% endif %}">Cost estimate</a>
      <a href="{% url 'immigration' %}" class="tab{% if active_tab == 'immigration' %} active{% endif %}">Immigration</a>
    </nav>

    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
