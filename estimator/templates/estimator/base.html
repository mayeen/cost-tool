{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assignment Cost Estimate</title>
  <link rel="stylesheet" href="{% static 'estimator/style.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>Assignment Cost Estimate</h1>
      <p class="subtitle">Cost to send an employee abroad.</p>
    </div>
  </header>

  <main class="wrap">
    <nav class="tabs" aria-label="Tool sections">
      <a href="{% url 'cost' %}{% if request.GET %}?{{ request.GET.urlencode }}{% endif %}" class="tab"{% if active_tab == 'cost' %} aria-current="page"{% endif %}>1 · Cost estimate</a>
      <a href="{% url 'immigration' %}{% if request.GET %}?{{ request.GET.urlencode }}{% endif %}" class="tab"{% if active_tab == 'immigration' %} aria-current="page"{% endif %}>2 · Immigration</a>

    </nav>

    <div class="panel">
      {% block content %}{% endblock %}
    </div>
  </main>
</body>

</html>
